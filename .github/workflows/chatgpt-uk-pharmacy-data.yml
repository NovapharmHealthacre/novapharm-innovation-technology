name: ChatGPT UK pharmacy public data build

on:
  push:
    branches:
      - chatgpt-uk-pharmacy-data-20260819
    paths:
      - 'tools/uk_pharmacy_data/**'
      - '.github/workflows/chatgpt-uk-pharmacy-data.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  fetch-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fetch dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch public UK pharmacy source files
        run: python tools/uk_pharmacy_data/fetch_sources.py

      - name: Show bundle inventory
        if: always()
        run: |
          find uk_pharmacy_sources -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort || true
          test -f uk_pharmacy_sources/manifest.json && cat uk_pharmacy_sources/manifest.json || true

      - name: Upload source bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-pharmacy-public-sources-20260819
          path: uk_pharmacy_sources/
          if-no-files-found: error
          retention-days: 3
