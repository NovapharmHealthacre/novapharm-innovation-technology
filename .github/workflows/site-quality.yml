name: Site quality

env:
  NEXT_TELEMETRY_DISABLED: 1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build static export
        run: npm run build
      - name: Validate export
        run: |
          set -o pipefail
          npm run validate:export 2>&1 | tee validation-report.txt
      - name: Prepare export diagnostics
        if: always()
        run: |
          {
            echo "EXPORTED FILES"
            find out -maxdepth 4 -type f | sort || true
            echo
            echo "CNAME"
            if test -f out/CNAME; then cat out/CNAME; else echo "missing"; fi
            echo
            echo "LOGO HASHES"
            sha256sum assets/NIT-logo.svg || true
            sha256sum out/assets/NIT-logo.svg || true
          } > export-diagnostics.txt
      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: export-validation-diagnostics
          path: |
            validation-report.txt
            export-diagnostics.txt
          if-no-files-found: warn
