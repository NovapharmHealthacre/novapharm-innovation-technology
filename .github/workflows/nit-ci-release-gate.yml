name: NIT CI governance and safe-release contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-release:
    name: NIT source, Google, web-quality and non-publishing release gate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify full site CI, approval contract and absence of branch-write publisher
        run: node --test scripts/test-nit-ci-release-contract.mjs
