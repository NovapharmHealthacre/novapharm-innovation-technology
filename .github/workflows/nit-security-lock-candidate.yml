name: NIT isolated dependency lock remediation (single candidate)

on:
  push:
    branches:
      - audit/nit-release-ci-protection-20261121
    paths:
      - .github/workflows/nit-security-lock-candidate.yml

permissions:
  contents: write

concurrency:
  group: nit-isolated-dependency-candidate-20261121
  cancel-in-progress: false

jobs:
  regenerate-isolated-branch:
    name: Regenerate and test security-only candidate lockfile
    if: github.repository == 'NovapharmHealthacre/novapharm-innovation-technology' && github.ref == 'refs/heads/audit/nit-release-ci-protection-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out only approved candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: audit/nit-release-ci-protection-20261121
          fetch-depth: 1
          persist-credentials: true
      - name: Confirm exact reviewed branch head and no main access
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/audit/nit-release-ci-protection-20261121"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/audit/nit-release-ci-protection-20261121 | cut -f1)" = "$GITHUB_SHA"
      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Pin audited fixed versions and resolve a genuine npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set dependencies.next=16.4.6 overrides.sharp=0.35.5 overrides.source-map-js=1.2.2
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Verify upgraded Next.js web app without deploying
        run: npm run typecheck && npm run lint && npm run build && npm run validate:export
      - name: Commit only validated manifest and lock to isolated candidate branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/audit/nit-release-ci-protection-20261121"
          test "$(git ls-remote origin refs/heads/audit/nit-release-ci-protection-20261121 | cut -f1)" = "$GITHUB_SHA"
          git add -- package.json package-lock.json
          git diff --cached --quiet && { echo "::error::No audited dependency changes"; exit 1; }
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "package-lock.json package.json "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): pin audited Next, sharp and source-map dependencies"
          git push origin HEAD:refs/heads/audit/nit-release-ci-protection-20261121
